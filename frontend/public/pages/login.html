<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PadhaiHub - Login Page</title>
  <script src="api-config.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#083a28',
            brandGreen: '#0d533b',
            brandOrange: '#e87830',
            brandOrangeHover: '#d8661e',
            bgBase: '#eef3ee',
            cardBg: '#e2ece4',
            inputBg: '#d8e5dc',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Global Page Styling */
    body {
      background-color: #eef3ee;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: #083a28;
      overflow-x: hidden;
    }

    /* Ambient 3D Geometric Spheres matching UI screenshot */
    .sphere-peach {
      position: fixed;
      top: -120px;
      left: -120px;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f8cbb0 0%, #f1aa82 100%);
      opacity: 0.85;
      filter: blur(2px);
      z-index: 0;
      pointer-events: none;
    }

    .sphere-white {
      position: fixed;
      top: 35%;
      right: -80px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #d3e1d8);
      box-shadow: 20px 20px 45px rgba(0, 0, 0, 0.05);
      z-index: 0;
      pointer-events: none;
    }

    .sphere-green {
      position: fixed;
      bottom: -150px;
      right: -100px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: linear-gradient(145deg, #a0c2ad 0%, #68987d 100%);
      opacity: 0.85;
      filter: blur(1px);
      z-index: 0;
      pointer-events: none;
    }

    /* Neumorphic Soft Card */
    .neu-card {
      background: #e2ece4;
      box-shadow: 
        20px 20px 40px #c6d3c9, 
        -20px -20px 40px #ffffff;
      border-radius: 2.25rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* Circular Elevated Icon Badges */
    .neu-icon-badge {
      background: #e2ece4;
      box-shadow: 
        5px 5px 10px #c6d3c9, 
        -5px -5px 10px #ffffff;
      border-radius: 50%;
      transition: all 0.25s ease;
    }

    /* Inset Soft Input Fields */
    .neu-input-container {
      background: #d8e5dc;
      box-shadow: 
        inset 4px 4px 8px #beccc1, 
        inset -4px -4px 8px #f2fff7;
      border-radius: 9999px;
      transition: all 0.25s ease;
    }

    .neu-input-container:focus-within {
      box-shadow: 
        inset 5px 5px 10px #b6c5b9, 
        inset -5px -5px 10px #ffffff,
        0 0 0 2px rgba(13, 83, 59, 0.2);
    }

    /* Role Pill Navigation */
    .neu-role-pill {
      background: #d8e5dc;
      box-shadow: 
        inset 2px 2px 5px #beccc1, 
        inset -2px -2px 5px #f2fff7;
      transition: all 0.25s ease;
    }

    .neu-role-btn {
      transition: all 0.25s ease;
      color: #083a28;
      font-weight: 600;
    }

    .neu-role-btn.active {
      background: #0d533b;
      color: #ffffff !important;
      box-shadow: 
        4px 4px 10px rgba(8, 58, 40, 0.3), 
        -2px -2px 8px rgba(255, 255, 255, 0.8);
    }

    /* Vibrant Submit Pill Button */
    .btn-orange-pill {
      background: linear-gradient(135deg, #e87830 0%, #d8661e 100%);
      box-shadow: 
        6px 6px 14px rgba(216, 102, 30, 0.35), 
        -3px -3px 8px rgba(255, 255, 255, 0.8);
      transition: all 0.25s ease;
    }

    .btn-orange-pill:hover {
      transform: translateY(-2px);
      box-shadow: 
        8px 8px 18px rgba(216, 102, 30, 0.45), 
        -3px -3px 10px rgba(255, 255, 255, 0.9);
    }

    .btn-orange-pill:active {
      transform: translateY(1px);
      box-shadow: 
        2px 2px 6px rgba(216, 102, 30, 0.4);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative">

  <!-- Ambient 3D Geometric Spheres -->
  <div class="sphere-peach"></div>
  <div class="sphere-white hidden sm:block"></div>
  <div class="sphere-green"></div>

  <!-- Main Login Container Card -->
  <main class="w-full max-w-md relative z-10 flex flex-col items-center">
    
    <!-- PadhaiHub Brand Logo Header -->
    <div class="flex flex-col items-center mb-6 text-center">
      <div class="w-16 h-16 bg-brandDark rounded-2xl flex items-center justify-center shadow-lg mb-3">
        <i class="fa-solid fa-graduation-cap text-emerald-200 text-3xl"></i>
      </div>
      <h1 class="text-3xl font-black text-brandDark tracking-tight">PadhaiHub</h1>
      <p class="text-xs font-semibold text-emerald-900/60 mt-1">Your Ultimate Learning Platform</p>
    </div>

    <!-- Login Card -->
    <div class="neu-card w-full p-6 sm:p-8 space-y-6">

      <!-- Role Selection Tabs -->
      <div class="neu-role-pill p-1.5 rounded-2xl grid grid-cols-2 sm:grid-cols-4 gap-1">
        <button 
          type="button" 
          onclick="setRole('student')" 
          id="role-student"
          class="neu-role-btn active py-2 text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all"
        >
          <i class="fa-solid fa-user-graduate text-[11px]"></i> Student
        </button>
        <button 
          type="button" 
          onclick="setRole('faculty')" 
          id="role-faculty"
          class="neu-role-btn py-2 text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all"
        >
          <i class="fa-solid fa-chalkboard-user text-[11px]"></i> Faculty
        </button>
        <button 
          type="button" 
          onclick="setRole('admin')" 
          id="role-admin"
          class="neu-role-btn py-2 text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all"
        >
          <i class="fa-solid fa-user-shield text-[11px]"></i> Admin
        </button>
        <button 
          type="button" 
          onclick="setRole('visitor')" 
          id="role-visitor"
          class="neu-role-btn py-2 text-xs rounded-xl flex items-center justify-center gap-1.5 transition-all"
        >
          <i class="fa-solid fa-compass text-[11px]"></i> Visitor
        </button>
      </div>

      <!-- Login Form Dynamic Fields -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">

        <!-- Dynamic Role Description -->
        <p id="roleDescription" class="text-xs font-bold text-center text-emerald-900/60 -mt-2">
          Enter your Roll Number and Key to access your student dashboard.
        </p>

        <!-- Input Field 1 (Roll No / Teacher's ID / Admin Key / Visitor Email) -->
        <div id="field1Container" class="flex items-center gap-3">
          <div class="neu-icon-badge w-12 h-12 flex-shrink-0 flex items-center justify-center text-brandDark">
            <i id="field1Icon" class="fa-solid fa-id-card text-emerald-800"></i>
          </div>
          <div class="neu-input-container flex-grow flex items-center px-4 py-3">
            <input 
              type="text" 
              id="field1Input"
              required 
              placeholder="Roll No" 
              class="w-full bg-transparent text-sm font-semibold text-brandDark placeholder-emerald-900/40 focus:outline-none"
            />
          </div>
        </div>

        <!-- Input Field 2 (Key / Password - Hidden for Admin & Curious Visitor) -->
        <div id="field2Container" class="flex items-center gap-3">
          <div class="neu-icon-badge w-12 h-12 flex-shrink-0 flex items-center justify-center text-brandDark">
            <i id="field2Icon" class="fa-solid fa-lock text-emerald-800"></i>
          </div>
          <div class="neu-input-container flex-grow flex items-center px-4 py-3 relative">
            <input 
              type="password" 
              id="field2Input"
              required 
              placeholder="Key / Password" 
              class="w-full bg-transparent text-sm font-semibold text-brandDark placeholder-emerald-900/40 focus:outline-none pr-8"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="absolute right-4 text-emerald-800/60 hover:text-emerald-900 transition-colors focus:outline-none"
              title="Toggle Password Visibility"
            >
              <i id="eyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Notification / Message Box -->
        <div id="msgBox" class="hidden text-xs text-center font-bold p-2.5 rounded-xl transition-all"></div>

        <!-- Bottom Action Row (Signup link & Orange Submit Button) -->
        <div class="flex items-center justify-between pt-2">
          <a href="#" onclick="handleSignupClick(event)" class="text-sm font-extrabold text-brandDark hover:text-brandOrange transition-colors">
            signup?
          </a>

          <button 
            type="submit" 
            id="submitBtn"
            class="btn-orange-pill text-white text-sm font-extrabold px-8 py-3 rounded-full tracking-wide"
          >
            Submit
          </button>
        </div>

      </form>

    </div>

  </main>

  <!-- Interactive Script Logic for Role Switching & Inputs -->
  <script>
    let currentRole = 'student';

    const roleConfig = {
      student: {
        desc: "Enter your Roll Number and Key to access your student dashboard.",
        field1: { placeholder: "Roll No", icon: "fa-id-card", type: "text", required: true },
        field2: { show: true, placeholder: "Key / Password", icon: "fa-lock", type: "password", required: true },
        btnText: "Submit"
      },
      faculty: {
        desc: "Enter your Teacher's ID and Key to access your portal.",
        field1: { placeholder: "Teacher's ID", icon: "fa-chalkboard-user", type: "text", required: true },
        field2: { show: true, placeholder: "Key / Password", icon: "fa-lock", type: "password", required: true },
        btnText: "Submit"
      },
      admin: {
        desc: "Enter your secure Admin Key to open system controls.",
        field1: { placeholder: "Admin Key", icon: "fa-key", type: "password", required: true },
        field2: { show: false, placeholder: "", icon: "", type: "", required: false },
        btnText: "Login Admin"
      },
      visitor: {
        desc: "Explore PadhaiHub features directly as a guest.",
        field1: { placeholder: "Email / Mobile (Optional)", icon: "fa-envelope", type: "text", required: false },
        field2: { show: false, placeholder: "", icon: "", type: "", required: false },
        btnText: "Explore Now"
      }
    };

    function setRole(role) {
      currentRole = role;

      // Reset message box
      const msgBox = document.getElementById('msgBox');
      msgBox.classList.add('hidden');

      // Update button tab highlights
      ['student', 'faculty', 'admin', 'visitor'].forEach(r => {
        const btn = document.getElementById(`role-${r}`);
        if (r === role) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const config = roleConfig[role];

      // Update description text
      document.getElementById('roleDescription').textContent = config.desc;

      // Configure Field 1
      const f1Input = document.getElementById('field1Input');
      const f1Icon = document.getElementById('field1Icon');
      f1Input.placeholder = config.field1.placeholder;
      f1Input.type = config.field1.type;
      f1Input.required = config.field1.required;
      f1Input.value = '';
      f1Icon.className = `fa-solid ${config.field1.icon} text-emerald-800`;

      // Configure Field 2
      const f2Container = document.getElementById('field2Container');
      const f2Input = document.getElementById('field2Input');
      const f2Icon = document.getElementById('field2Icon');

      if (config.field2.show) {
        f2Container.classList.remove('hidden');
        f2Input.placeholder = config.field2.placeholder;
        f2Input.type = config.field2.type;
        f2Input.required = config.field2.required;
        f2Input.value = '';
        f2Icon.className = `fa-solid ${config.field2.icon} text-emerald-800`;
      } else {
        f2Container.classList.add('hidden');
        f2Input.required = false;
        f2Input.value = '';
      }

      // Update Submit Button Text
      document.getElementById('submitBtn').textContent = config.btnText;
    }

    // Toggle Password Visibility Eye Icon
    function togglePasswordVisibility() {
      const f2Input = document.getElementById('field2Input');
      const f1Input = document.getElementById('field1Input');
      const eyeIcon = document.getElementById('eyeIcon');

      // Admin key uses field1, standard roles use field2
      const targetInput = (currentRole === 'admin') ? f1Input : f2Input;

      if (targetInput.type === 'password') {
        targetInput.type = 'text';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      } else {
        targetInput.type = 'password';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      }
    }

    // Handle Form Submission
    async function handleLoginSubmit(event) {
    event.preventDefault();
    
    const identifier = document.getElementById('field1Input').value;
    const password = currentRole !== 'visitor' && currentRole !== 'admin' ? document.getElementById('field2Input').value : (currentRole === 'admin' ? identifier : '');
    
    const msgBox = document.getElementById('msgBox');
    msgBox.classList.remove('hidden', 'bg-rose-200/80', 'text-rose-900', 'bg-emerald-200/80', 'text-emerald-900');
    
    // Show loading state
    msgBox.classList.add('bg-emerald-200/80', 'text-emerald-900');
    msgBox.textContent = `Verifying credentials with database...`;

    try {
        // Send request to backend Node.js server
        const response = await fetch(`${API_BASE_URL}/api/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                role: currentRole,
                identifier: identifier,
                password: password
            })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            msgBox.textContent = `✅ Login Successful! Redirecting...`;
            
            // Save user session in localStorage if needed
            localStorage.setItem('userRole', currentRole);
            localStorage.setItem('userIdentifier', identifier);

            setTimeout(() => {
                window.location.href = 'home.html';
            }, 1000);
        } else {
            msgBox.classList.remove('bg-emerald-200/80', 'text-emerald-900');
            msgBox.classList.add('bg-rose-200/80', 'text-rose-900');
            msgBox.textContent = `❌ ${result.error || 'Authentication failed. Please check your details.'}`;
        }

    } catch (err) {
        console.error("Network or server error:", err);
        msgBox.classList.remove('bg-emerald-200/80', 'text-emerald-900');
        msgBox.classList.add('bg-rose-200/80', 'text-rose-900');
        msgBox.textContent = `❌ Network error: Could not reach backend server.`;
    }
}
  </script>
</body>
</html>
