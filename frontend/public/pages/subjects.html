<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Select Study Material</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Selection Grid Container */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    /* Individual Option Card */
    .option-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 10px 10px 22px #cfd6cc, -10px -10px 22px #ffffff;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    .option-card:hover {
      transform: translateY(-4px);
      border-color: #1b3b2b;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
    }

    .card-icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 5px 5px 12px #cfd6cc, -5px -5px 12px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #e76f51;
      flex-shrink: 0;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1b3b2b;
    }

    .card-desc {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .arrow-icon {
      font-size: 14px;
      color: #1b3b2b;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Background Ambient Shapes -->
  <div class="shape shape-peach"></div>
  <div class="shape shape-green"></div>

  <div class="app-container">
    
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="home.html" class="back-btn" title="Back to Categories">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="brand-group">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="brand-name">PadhaiHub - Study Hub</div>
        </div>
      </div>
    </header>

    <!-- Options Selection Grid -->
   <div class="grid-container" id="subjectsGrid">
    <!-- Dynamically populated by script -->
</div>

<script>
    // Vast & Comprehensive Subject Database mapped across Engineering Branches
    const branchSubjects = {
        "Computer Science & Engineering": [
            { name: "Data Structures & Algorithms", icon: "fa-code", desc: "Arrays, Trees, Graphs, DP & Sorting" },
            { name: "Database Management Systems", icon: "fa-database", desc: "SQL, Relational Algebra, ER Models & Normalization" },
            { name: "Operating Systems", icon: "fa-laptop-code", desc: "CPU Scheduling, Synchronization, Deadlocks & Memory" },
            { name: "Object Oriented Programming", icon: "fa-mug-hot", desc: "Classes, Inheritance, Polymorphism & STL" },
            { name: "Computer Networks", icon: "fa-network-wired", desc: "TCP/IP, OSI Layers, Routing & Network Security" },
            { name: "Software Engineering", icon: "fa-diagram-project", desc: "SDLC Models, SRS, DFD & Testing Methodologies" },
            { name: "Artificial Intelligence & ML", icon: "fa-robot", desc: "Supervised Learning, Neural Networks & NLP" },
            { name: "Theory of Computation", icon: "fa-brain", desc: "Automata, Turing Machines & Complexity Theory" },
            { name: "Computer Architecture", icon: "fa-microchip", desc: "Pipelining, Cache Memory & Instruction Sets" }
        ],
        "Mechanical Engineering": [
            { name: "Engineering Thermodynamics", icon: "fa-fire", desc: "Laws of Thermodynamics, Entropy & Power Cycles" },
            { name: "Fluid Mechanics", icon: "fa-water", desc: "Fluid Statics, Kinematics & Navier-Stokes Equations" },
            { name: "Strength of Materials", icon: "fa-dumbbell", desc: "Stress, Strain, Bending Moments & Shear Forces" },
            { name: "Theory of Machines", icon: "fa-gears", desc: "Kinematics, Cams, Governors & Balancing" },
            { name: "Machine Design", icon: "fa-pencil-ruler", desc: "Design of Shafts, Gears, Bearings & Fasteners" },
            { name: "Heat Transfer", icon: "fa-temperature-high", desc: "Conduction, Convection, Radiation & Heat Exchangers" }
        ],
        "Electronics & Communication": [
            { name: "Digital Electronics", icon: "fa-microchip", desc: "Logic Gates, Boolean Algebra, Flip-Flops & FSM" },
            { name: "Analog Circuits", icon: "fa-wave-square", desc: "Diodes, BJT, MOSFET Amplifiers & Op-Amps" },
            { name: "Signals and Systems", icon: "fa-signal", desc: "Fourier Transforms, Laplace & LTI Systems" },
            { name: "Microprocessors & Microcontrollers", icon: "fa-cpu", desc: "8086 Architecture, Assembly & Interfacing" },
            { name: "Communication Systems", icon: "fa-tower-broadcast", desc: "AM/FM Modulation, Information Theory & Digital Comm" }
        ],
        "Electrical Engineering": [
            { name: "Electrical Machines", icon: "fa-bolt", desc: "Transformers, DC Machines & Induction Motors" },
            { name: "Power Systems", icon: "fa-plug", desc: "Generation, Transmission, Fault Analysis & Protection" },
            { name: "Control Systems", icon: "fa-sliders", desc: "Transfer Functions, Bode Plots & Nyquist Stability" },
            { name: "Power Electronics", icon: "fa-charging-station", desc: "Thyristors, Inverters, Choppers & Rectifiers" },
            { name: "Circuit Theory", icon: "fa-bolt-lightning", desc: "Network Theorems, Transient Analysis & Two-Port Networks" }
        ],
        "Civil Engineering": [
            { name: "Structural Analysis", icon: "fa-building", desc: "Trusses, Arches, Cables & Matrix Methods" },
            { name: "Geotechnical Engineering", icon: "fa-mountain", desc: "Soil Mechanics, Foundation Design & Shear Strength" },
            { name: "Transportation Engineering", icon: "fa-road", desc: "Highway Alignment, Traffic Design & Pavements" },
            { name: "Environmental Engineering", icon: "fa-seedling", desc: "Water Treatment, Air Pollution & Waste Management" },
            { name: "Surveying & Geomatics", icon: "fa-compass", desc: "Levelling, Theodolite & GPS Surveying Techniques" }
        ],
        "Data Science & AI": [
            { name: "Python for Data Science", icon: "fa-python", desc: "NumPy, Pandas, Matplotlib & Data Wrangling" },
            { name: "Machine Learning Algorithms", icon: "fa-chart-line", desc: "Regression, Classification, SVM & Random Forests" },
            { name: "Deep Learning", icon: "fa-brain", desc: "CNNs, RNNs, Transformers & PyTorch Framework" },
            { name: "Big Data Analytics", icon: "fa-database", desc: "Hadoop, Spark, and Distributed Data Processing" }
        ]
    };

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        let branch = urlParams.get('branch') || 'Computer Science & Engineering';
        
        // Normalize branch names if coming from short forms
        if (branch === 'CSE') branch = 'Computer Science & Engineering';
        else if (branch === 'ME') branch = 'Mechanical Engineering';
        else if (branch === 'ECE') branch = 'Electronics & Communication';
        else if (branch === 'EE') branch = 'Electrical Engineering';
        else if (branch === 'Civil') branch = 'Civil Engineering';

        document.querySelector('.brand-name').innerText = `PadhaiHub - ${branch}`;
        
        const grid = document.getElementById('subjectsGrid');
        grid.innerHTML = '';

        // Fetch subjects corresponding to selected branch (Fallback to CSE if not found)
        const subjects = branchSubjects[branch] || branchSubjects["Computer Science & Engineering"];

        subjects.forEach(sub => {
            const cardHTML = `
                <div class="option-card" onclick="selectSubject('${sub.name}')">
                    <div class="card-icon-badge"><i class="fa-solid ${sub.icon}"></i></div>
                    <div class="card-info">
                        <div class="card-title">${sub.name}</div>
                        <div class="card-desc">${sub.desc}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHTML);
        });
    };

  function selectSubject(subjectName) {
    const urlParams = new URLSearchParams(window.location.search);
    const branch = urlParams.get('branch') || 'CSE';
    
    // CRITICAL FIX: encodeURIComponent ensures special chars like '&' in "Data Structures & Algorithms" don't break URL parameters
    window.location.href = `categories.html?branch=${encodeURIComponent(branch)}&subject=${encodeURIComponent(subjectName)}`;
}
</script>  </div>

</body>
</html>
