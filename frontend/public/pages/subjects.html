<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Branch Subjects</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="subjects.css">
</head>
<body>

  <!-- Floating Background Clay Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- Main Outer Container -->
  <div class="container">

    <!-- Header Bar with Back Button & Active Branch Identifier -->
    <header class="top-header">
      <button type="button" class="back-btn" onclick="handleGoBack()" aria-label="Go Back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z" clip-rule="evenodd" />
        </svg>
      </button>

      <div class="branch-badge">
        <span class="branch-icon" id="branchIcon">💻</span>
        <div class="branch-info">
          <h1 class="branch-title" id="branchTitle">CSE Syllabus</h1>
          <p class="branch-subtitle" id="branchSubtitle">Computer Science & Engineering</p>
        </div>
      </div>
    </header>

    <!-- Branch Switcher Selector Pills -->
    <div class="branch-pills-bar">
      <button class="pill-btn active" onclick="switchBranch('CSE')">CSE</button>
      <button class="pill-btn" onclick="switchBranch('ME')">ME</button>
      <button class="pill-btn" onclick="switchBranch('ECE')">ECE</button>
      <button class="pill-btn" onclick="switchBranch('Robotics')">Robotics</button>
      <button class="pill-btn" onclick="switchBranch('Maths')">Maths</button>
      <button class="pill-btn" onclick="switchBranch('Physics')">Physics</button>
      <button class="pill-btn" onclick="switchBranch('EE')">EE</button>
      <button class="pill-btn" onclick="switchBranch('Civil')">Civil</button>
      <button class="pill-btn" onclick="switchBranch('BioTech')">BioTech</button>
    </div>

    <!-- Main Content Container for Subjects -->
    <main class="subjects-card" id="subjectsContent">
      <!-- Content populated dynamically by JavaScript -->
    </main>

  </div>

  <!-- Resource Popup Modal (Matching Notebook Sketch) -->
  <div class="modal-overlay" id="resourceModalOverlay" onclick="closeResourceModal()">
    <div class="resource-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3 id="modalSubjectTitle">Subject Name</h3>
          <p>Select Study Material</p>
        </div>
        <button class="close-modal-btn" onclick="closeResourceModal()">×</button>
      </div>

      <!-- Resource List Options (Matching Hand-Drawn Sketch) -->
      <div class="resource-list">
        
        <!-- 1. Youtube Video -->
        <div class="resource-row" onclick="openResource('Youtube Video')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4.5 4.5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3v-9a3 3 0 0 0-3-3h-15ZM10.5 8.25l5.25 3.75-5.25 3.75V8.25Z" />
            </svg>
          </div>
          <div class="resource-pill">Youtube Video</div>
        </div>

        <!-- 2. PYQs -->
        <div class="resource-row" onclick="openResource('PYQs')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0 0 16.5 9h-1.875a1.875 1.875 0 0 1-1.875-1.875V5.25A3.75 3.75 0 0 0 9 1.5H5.625ZM7.5 15a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 7.5 15Zm.75 2.25a.75.75 0 0 0 0 1.5h4.5a.75.75 0 0 0 0-1.5h-4.5Z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="resource-pill">PYQs</div>
        </div>

        <!-- 3. Research Paper -->
        <div class="resource-row" onclick="openResource('Research Paper')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="resource-pill">Research Paper</div>
        </div>

        <!-- 4. Books -->
        <div class="resource-row" onclick="openResource('Books')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.237 8.237 0 0 1 18 18.75c1.26 0 2.435.281 3.5.783a.75.75 0 0 0 1-.707V4.582a.75.75 0 0 0-.5-.707A9.735 9.735 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
            </svg>
          </div>
          <div class="resource-pill">Books</div>
        </div>

        <!-- 5. Courses -->
        <div class="resource-row" onclick="openResource('Courses')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.7 2.805a.75.75 0 0 1 .6 0l9.4 4.7a.75.75 0 0 1 .1.123 1.5 1.5 0 0 1-.1 1.76l-9.4 5.875a.75.75 0 0 1-.6 0l-9.4-5.875A1.5 1.5 0 0 1 2.2 7.63a.75.75 0 0 1 .1-.123l9.4-4.702ZM12 10.41l7.2-4.5L12 2.31 4.8 5.91l7.2 4.5Z" />
            </svg>
          </div>
          <div class="resource-pill">Courses</div>
        </div>

        <!-- 6. Roadmap -->
        <div class="resource-row" onclick="openResource('Roadmap')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M8.25 6.75a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0ZM15.75 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM2.25 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM12 12.75a.75.75 0 0 1 .75.75v3.69l1.72-1.72a.75.75 0 1 1 1.06 1.06l-3 3a.75.75 0 0 1-1.06 0l-3-3a.75.75 0 1 1 1.06-1.06l1.72 1.72V13.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="resource-pill">Roadmap</div>
        </div>

        <!-- 7. Quiz (Test) -->
        <div class="resource-row" onclick="openResource('Quiz (Test)')">
          <div class="resource-circle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm11.378-3.917c-.e8-.777-1.014-1.333-2.128-1.333-1.458 0-2.25.867-2.25 1.833 0 1.258.983 1.733 2.158 2.142 1.275.441 2.292.933 2.292 2.308 0 1.342-1.125 2.217-2.525 2.217-1.35 0-2.208-.667-2.583-1.608a.75.75 0 1 1 1.392-.558c.208.517.692.916 1.191.916.717 0 1.025-.425 1.025-.717 0-.666-.658-1.025-1.925-1.483-1.192-.433-2.525-.975-2.525-2.458 0-1.742 1.45-2.833 3.25-2.833 1.633 0 2.658.858 3.017 1.958a.75.75 0 0 1-1.392.558Z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="resource-pill">Quiz (Test)</div>
        </div>

      </div>
    </div>
  </div>

  <!-- Interactive Script -->
  <script>

          { year: "Year 2", subjects: ["Thermodynamics", "Fluid Mechanics", "Strength of Materials", "Kinematics of Machines", "Manufacturing Technology"] },
          { year: "Year 3", subjects: ["Dynamics of Machinery", "Heat & Mass Transfer", "Design of Machine Elements", "IC Engines", "CAD / CAM"] },

        ]

        ]
      },

        years: [
          { year: "Year 1", subjects: ["Calculus & Linear Algebra", "Differential Equations", "Physics", "Computer Fundamentals", "Communication Skills"] },

          { year: "Year 2", subjects: ["Electrical Circuit Analysis", "Electrical Machines I", "Electromagnetic Fields", "Analog Electronics", "Power Systems I"] },

          { year: "Year 4", subjects: ["High Voltage Engineering", "Smart Grid Technologies", "Renewable Energy Systems", "Electric Vehicles", "Major Project"] }
        ]
      },
      Civil: {
        title: "Civil Syllabus",
        subtitle: "Civil Engineering",
        icon: "🏗️",
        years: [
          { year: "Year 1", subjects: ["Engineering Mathematics", "Engineering Chemistry", "Basic Civil & Mech", "Engineering Physics", "Environmental Studies"] },
          { year: "Year 2", subjects: ["Building Materials", "Surveying", "Mechanics of Solids", "Fluid Mechanics", "Structural Analysis I"] },
          { year: "Year 3", subjects: ["Concrete Technology", "Geotechnical Engineering", "Transportation Engg.", "Hydraulics", "Design of Steel Structures"] },
          { year: "Year 4", subjects: ["Structural Analysis II", "Environmental Engineering", "Construction Management", "Earthquake Engg.", "Major Project"] }
        ]
      },
      BioTech: {

        subtitle: "Biotechnology Engineering",

          { year: "Year 4", subjects: ["Biomedical Engineering", "Genomics & Proteomics", "Biopharmaceutical Technology", "Biosafety & Ethics", "Research Project"] }
        ]
      }
    };

    let activeSubject = "";

    function renderBranch(code) {
      const data = branchData[code] || branchData.CSE;

      document.getElementById('branchIcon').innerText = data.icon;
      document.getElementById('branchTitle').innerText = data.title;
      document.getElementById('branchSubtitle').innerText = data.subtitle;

      let html = '';
      data.years.forEach(yearGroup => {
        html += `
          <div class="year-block">
            <div class="year-heading">${yearGroup.year}</div>
            <div class="subjects-grid">
        `;
        yearGroup.subjects.forEach(subject => {
          html += `
            <div class="subject-card" onclick="openSubjectModal('${subject.replace(/'/g, "\\'")}')">
              <div class="subject-icon-bullet">📖</div>
              <div class="subject-name">${subject}</div>
            </div>
          `;
        });
        html += `
            </div>
          </div>
        `;
      });

      document.getElementById('subjectsContent').innerHTML = html;
    }

    function switchBranch(code) {
      const pills = document.querySelectorAll('.pill-btn');
      pills.forEach(pill => {
        if (pill.innerText.trim() === code) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });

      renderBranch(code);
    }

    function handleGoBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'home.html';
      }
    }

    /* Modal Popup Trigger Functions */
    function openSubjectModal(subjectName) {
      activeSubject = subjectName;
      document.getElementById('modalSubjectTitle').innerText = subjectName;
      document.getElementById('resourceModalOverlay').classList.add('active');
    }

    function closeResourceModal() {
      document.getElementById('resourceModalOverlay').classList.remove('active');
    }

    function openResource(resourceType) {
      alert("Opening " + resourceType + " for " + activeSubject);
      closeResourceModal();
    }

    // Initialize Page
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const branchParam = urlParams.get('branch');
      if (branchParam && branchData[branchParam.toUpperCase()]) {
        switchBranch(branchParam.toUpperCase());
      } else {
        renderBranch('CSE');
      }
    };
  </script>
</body>
</html>
