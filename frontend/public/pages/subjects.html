<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Select Study Material</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Selection Grid Container */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    /* Individual Option Card */
    .option-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 10px 10px 22px #cfd6cc, -10px -10px 22px #ffffff;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    .option-card:hover {
      transform: translateY(-4px);
      border-color: #1b3b2b;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
    }

    .card-icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 5px 5px 12px #cfd6cc, -5px -5px 12px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #e76f51;
      flex-shrink: 0;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1b3b2b;
    }

    .card-desc {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .arrow-icon {
      font-size: 14px;
      color: #1b3b2b;
      opacity: 0.6;
    }

    .subject-search {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 14px 18px;
      background: #eef2eb;
      color: #1b3b2b;
      box-shadow: inset 4px 4px 8px #cfd6cc, inset -4px -4px 8px #fff;
      font: inherit;
      font-size: 16px;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 24px;
      text-align: center;
      color: #6a7b72;
    }

    .option-card {
      width: 100%;
      border: 0;
      text-align: left;
      font: inherit;
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .navbar { padding: 12px 14px; border-radius: 20px; }
      .brand-name { font-size: 16px; }
      .grid-container { grid-template-columns: 1fr; gap: 14px; }
      .option-card { padding: 18px; border-radius: 20px; }
    }
  </style>
</head>
<body>

  <!-- Background Ambient Shapes -->
  <div class="shape shape-peach"></div>
  <div class="shape shape-green"></div>

  <div class="app-container">
    
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="home.html" class="back-btn" title="Back to Categories">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="brand-group">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="brand-name">PadhaiHub - Study Hub</div>
        </div>
      </div>
    </header>

    <!-- Options Selection Grid -->
   <input class="subject-search" type="search" id="subjectSearch" placeholder="Search subjects in this branch" aria-label="Search subjects">
   <div class="grid-container" id="subjectsGrid">
    <!-- Dynamically populated by script -->
</div>

<script>
    const branchSubjects = {
        "Computer Science & Engineering": ["Data Structures & Algorithms", "Database Management Systems", "Operating Systems", "Object Oriented Programming", "Computer Networks", "Software Engineering", "Artificial Intelligence", "Machine Learning", "Theory of Computation", "Computer Architecture", "Compiler Design", "Web Development", "Cloud Computing", "Cyber Security", "Distributed Systems", "Data Mining", "Mobile App Development"],
        "Mechanical Engineering": ["Engineering Thermodynamics", "Fluid Mechanics", "Strength of Materials", "Theory of Machines", "Machine Design", "Heat Transfer", "Manufacturing Processes", "Engineering Materials", "CAD/CAM", "Refrigeration & Air Conditioning", "Industrial Engineering", "Finite Element Analysis"],
        "Electronics & Communication": ["Digital Electronics", "Analog Circuits", "Signals and Systems", "Microprocessors & Microcontrollers", "Communication Systems", "Electromagnetic Theory", "VLSI Design", "Digital Signal Processing", "Control Systems", "Embedded Systems", "Wireless Communication", "Antenna & Wave Propagation"],
        "Electrical Engineering": ["Electrical Machines", "Power Systems", "Control Systems", "Power Electronics", "Circuit Theory", "Electrical Measurements", "Network Analysis", "Switchgear & Protection", "High Voltage Engineering", "Electrical Drives", "Renewable Energy Systems", "Signals & Systems"],
        "Civil Engineering": ["Structural Analysis", "Geotechnical Engineering", "Transportation Engineering", "Environmental Engineering", "Surveying & Geomatics", "Building Materials", "Concrete Technology", "Fluid Mechanics", "Hydrology & Water Resources", "Construction Planning", "Steel Structures", "Foundation Engineering"],
        "Data Science & AI": ["Python for Data Science", "Probability & Statistics", "Machine Learning", "Deep Learning", "Natural Language Processing", "Computer Vision", "Big Data Analytics", "Data Mining", "Reinforcement Learning", "Generative AI", "Data Visualization", "MLOps"],
        "Robotics & Automation": ["Robot Kinematics", "Robot Dynamics", "Sensors & Actuators", "Industrial Robotics", "Control Systems", "Machine Vision", "Embedded Systems", "PLC & SCADA", "Autonomous Mobile Robots", "Robot Operating System (ROS)"],
        "Mathematics": ["Engineering Mathematics I", "Engineering Mathematics II", "Linear Algebra", "Calculus", "Differential Equations", "Probability & Statistics", "Discrete Mathematics", "Numerical Methods", "Complex Analysis", "Graph Theory", "Optimization Techniques"],
        "Physics": ["Engineering Mechanics", "Electromagnetism", "Optics", "Quantum Mechanics", "Solid State Physics", "Thermodynamics", "Waves & Oscillations", "Modern Physics", "Electronics", "Nuclear Physics"],
        "Biotechnology": ["Cell Biology", "Molecular Biology", "Biochemistry", "Genetics", "Microbiology", "Bioprocess Engineering", "Immunology", "Bioinformatics", "Genetic Engineering", "Enzyme Technology", "Plant Biotechnology"],
        "Aeronautical Engineering": ["Aerodynamics", "Aircraft Structures", "Flight Mechanics", "Aircraft Propulsion", "Avionics", "Aircraft Performance", "Aerospace Materials", "Gas Turbine Engines", "Computational Fluid Dynamics", "Space Dynamics"],
        "Aerospace Engineering": ["Aerodynamics", "Aircraft Structures", "Flight Mechanics", "Propulsion Systems", "Orbital Mechanics", "Spacecraft Systems", "Avionics", "Aerospace Materials", "Rocket Propulsion", "Computational Fluid Dynamics"],
        "Chemical Engineering": ["Chemical Process Calculations", "Fluid Mechanics", "Heat Transfer", "Mass Transfer", "Chemical Reaction Engineering", "Process Control", "Thermodynamics", "Separation Processes", "Plant Design", "Polymer Technology", "Process Safety"],
        "Environmental Studies": ["Environmental Chemistry", "Ecology & Biodiversity", "Water & Wastewater Treatment", "Air Pollution Control", "Solid Waste Management", "Environmental Impact Assessment", "Climate Change", "Sustainable Development", "Environmental Microbiology"],
        "Architecture & Design": ["Architectural Design", "Building Construction", "Architectural History", "Building Materials", "Building Services", "Urban Planning", "Landscape Architecture", "Sustainable Architecture", "Structures for Architects", "Computer-Aided Design"],
        "Cyber Security": ["Network Security", "Cryptography", "Ethical Hacking", "Digital Forensics", "Application Security", "Cloud Security", "Security Operations", "Identity & Access Management", "Secure Software Design", "Incident Response"],
        "Information Technology": ["Data Structures & Algorithms", "Database Management Systems", "Operating Systems", "Computer Networks", "Web Technologies", "Software Engineering", "Cloud Computing", "Information Security", "Distributed Systems", "Mobile Computing", "Data Warehousing"],
        "Biomedical Engineering": ["Biomedical Instrumentation", "Human Anatomy & Physiology", "Medical Imaging", "Biomechanics", "Biomaterials", "Biomedical Signal Processing", "Clinical Engineering", "Rehabilitation Engineering", "Medical Electronics"],
        "Agricultural Engineering": ["Soil & Water Conservation", "Irrigation Engineering", "Farm Machinery", "Agricultural Process Engineering", "Watershed Management", "Renewable Energy in Agriculture", "Post-Harvest Technology", "Protected Cultivation", "Agricultural Structures"],
        "Industrial Engineering": ["Operations Research", "Production Planning & Control", "Quality Engineering", "Supply Chain Management", "Work Study & Ergonomics", "Manufacturing Systems", "Operations Management", "Reliability Engineering", "Lean Manufacturing"],
        "Automobile Engineering": ["Automotive Engines", "Vehicle Dynamics", "Automotive Transmission", "Automotive Electrical Systems", "Vehicle Design", "Electric & Hybrid Vehicles", "Automotive Electronics", "Engine Emissions", "Automotive Manufacturing"],
        "Mechatronics Engineering": ["Mechatronics Systems", "Sensors & Actuators", "Microcontrollers", "Industrial Automation", "Control Engineering", "Robotics", "PLC & SCADA", "Embedded Systems", "Machine Vision"],
        "Mining Engineering": ["Mine Surveying", "Mine Ventilation", "Rock Mechanics", "Surface Mining", "Underground Mining", "Mine Safety", "Mineral Processing", "Mine Planning", "Environmental Management in Mining"]
    };

    const branchAliases = {
        CSE: "Computer Science & Engineering",
        ME: "Mechanical Engineering",
        ECE: "Electronics & Communication",
        EE: "Electrical Engineering",
        Civil: "Civil Engineering",
        "Environmental Engineering": "Environmental Studies",
        "Computer Science": "Computer Science & Engineering"
    };

    const iconByBranch = {
        "Computer Science & Engineering": "fa-code",
        "Mechanical Engineering": "fa-gears",
        "Electronics & Communication": "fa-microchip",
        "Electrical Engineering": "fa-bolt",
        "Civil Engineering": "fa-building",
        "Data Science & AI": "fa-chart-line",
        "Robotics & Automation": "fa-robot",
        "Mathematics": "fa-square-root-variable",
        "Physics": "fa-atom",
        "Biotechnology": "fa-dna"
    };

    const params = new URLSearchParams(window.location.search);
    const requestedBranch = params.get('branch') || 'Computer Science & Engineering';
    const branch = branchAliases[requestedBranch] || requestedBranch;
    const subjects = branchSubjects[branch] || [];
    document.querySelector('.brand-name').textContent = `PadhaiHub - ${branch}`;

    const grid = document.getElementById('subjectsGrid');
    const search = document.getElementById('subjectSearch');

    function renderSubjects() {
        const query = search.value.trim().toLocaleLowerCase();
        const visibleSubjects = subjects.filter(subject => subject.toLocaleLowerCase().includes(query));
        grid.replaceChildren();

        if (visibleSubjects.length === 0) {
            const emptyState = document.createElement('p');
            emptyState.className = 'empty-state';
            emptyState.textContent = subjects.length
                ? 'No subjects match your search.'
                : 'No subject catalog is available for this branch yet.';
            grid.append(emptyState);
            return;
        }

        for (const subject of visibleSubjects) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'option-card';
            card.addEventListener('click', () => selectSubject(subject));

            const iconBadge = document.createElement('span');
            iconBadge.className = 'card-icon-badge';
            const icon = document.createElement('i');
            icon.className = `fa-solid ${iconByBranch[branch] || 'fa-book-open'}`;
            iconBadge.append(icon);

            const info = document.createElement('span');
            info.className = 'card-info';
            const title = document.createElement('span');
            title.className = 'card-title';
            title.textContent = subject;
            const description = document.createElement('span');
            description.className = 'card-desc';
            description.textContent = `Study resources and lectures for ${subject}`;
            info.append(title, description);

            const arrow = document.createElement('i');
            arrow.className = 'fa-solid fa-chevron-right arrow-icon';
            card.append(iconBadge, info, arrow);
            grid.append(card);
        }
    }

    function selectSubject(subjectName) {
        window.location.href = `categories.html?branch=${encodeURIComponent(branch)}&subject=${encodeURIComponent(subjectName)}`;
    }

    search.addEventListener('input', renderSubjects);
    renderSubjects();
</script>  </div>

</body>
</html>
