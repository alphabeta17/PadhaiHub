<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Select Study Material</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Selection Grid Container */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    /* Individual Option Card */
    .option-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 10px 10px 22px #cfd6cc, -10px -10px 22px #ffffff;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    .option-card:hover {
      transform: translateY(-4px);
      border-color: #1b3b2b;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
    }

    .card-icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 5px 5px 12px #cfd6cc, -5px -5px 12px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #e76f51;
      flex-shrink: 0;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1b3b2b;
    }

    .card-desc {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .arrow-icon {
      font-size: 14px;
      color: #1b3b2b;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Background Ambient Shapes -->
  <div class="shape shape-peach"></div>
  <div class="shape shape-green"></div>

  <div class="app-container">
    
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="categories.html" class="back-btn" title="Back to Categories">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="brand-group">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="brand-name">PadhaiHub - Study Hub</div>
        </div>
      </div>
    </header>

    <!-- Options Selection Grid -->
    <div class="grid-container">
      
      <!-- 1. YouTube Videos -->
      <div class="option-card" onclick="location.href='youtube-videos.html'">
        <div class="card-icon-badge"><i class="fa-solid fa-video"></i></div>
        <div class="card-info">
          <div class="card-title">Video Lectures</div>
          <div class="card-desc">Ranked One-Shot & Full Courses</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </div>

      <!-- 2. PYQs -->
      <div class="option-card" onclick="location.href='pyqs.html'">
        <div class="card-icon-badge"><i class="fa-solid fa-file-lines"></i></div>
        <div class="card-info">
          <div class="card-title">Previous Year Qs</div>
          <div class="card-desc">Semester & Exam Papers PDF</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </div>

      <!-- 3. Quiz -->
      <div class="option-card" onclick="location.href='quiz.html'">
        <div class="card-icon-badge"><i class="fa-solid fa-circle-check"></i></div>
        <div class="card-info">
          <div class="card-title">Practice Quiz</div>
          <div class="card-desc">Interactive Mock Tests & MCQs</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </div>

      <!-- 4. Books -->
      <div class="option-card" onclick="location.href='books.html'">
        <div class="card-icon-badge"><i class="fa-solid fa-book"></i></div>
        <div class="card-info">
          <div class="card-title">Reference Books</div>
          <div class="card-desc">Standard Textbooks & E-Books</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </div>

      <!-- 5. Roadmap -->
      <div class="option-card" onclick="location.href='roadmap.html'">
        <div class="card-icon-badge"><i class="fa-solid fa-sitemap"></i></div>
        <div class="card-info">
          <div class="card-title">Study Roadmaps</div>
          <div class="card-desc">Structured Exam & Skill Plans</div>
        </div>
        <i class="fa-solid fa-chevron-right arrow-icon"></i>
      </div>

    </div>

  </div>

</body>
</html>
