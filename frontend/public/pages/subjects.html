  <!-- Stylesheet -->

<body>

  <!-- Floating Background Clay Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <!-- Main Outer Container -->
  <div class="container">

    <!-- Header Bar with Back Button & Active Branch Identifier -->
    <header class="top-header">
      <button type="button" class="back-btn" onclick="handleGoBack()" aria-label="Go Back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z" clip-rule="evenodd" />
        </svg>
      </button>

      <div class="branch-badge">
        <span class="branch-icon" id="branchIcon">💻</span>
        <div class="branch-info">
          <h1 class="branch-title" id="branchTitle">CSE Syllabus</h1>
          <p class="branch-subtitle" id="branchSubtitle">Computer Science & Engineering</p>
        </div>
      </div>
    </header>

    <!-- Branch Switcher Selector Pills -->
    <div class="branch-pills-bar">
      <button class="pill-btn active" onclick="switchBranch('CSE')">CSE</button>
      <button class="pill-btn" onclick="switchBranch('ME')">ME</button>
      <button class="pill-btn" onclick="switchBranch('ECE')">ECE</button>
      <button class="pill-btn" onclick="switchBranch('Robotics')">Robotics</button>
      <button class="pill-btn" onclick="switchBranch('Maths')">Maths</button>
      <button class="pill-btn" onclick="switchBranch('Physics')">Physics</button>
      <button class="pill-btn" onclick="switchBranch('EE')">EE</button>
      <button class="pill-btn" onclick="switchBranch('Civil')">Civil</button>
      <button class="pill-btn" onclick="switchBranch('BioTech')">BioTech</button>
    </div>

    <!-- Main Content Container for Subjects -->
    <main class="subjects-card" id="subjectsContent">
      <!-- Content populated dynamically by JavaScript -->
    </main>

  </div>

    function renderBranch(code) {
      const data = branchData[code] || branchData.CSE;

      // Update header details
      document.getElementById('branchIcon').innerText = data.icon;
      document.getElementById('branchTitle').innerText = data.title;
      document.getElementById('branchSubtitle').innerText = data.subtitle;

      // Build subjects HTML block
      let html = '';
      data.years.forEach(yearGroup => {
        html += `
          <div class="year-block">
            <div class="year-heading">${yearGroup.year}</div>
            <div class="subjects-grid">
        `;
        yearGroup.subjects.forEach(subject => {
          html += `
            <div class="subject-card" onclick="openSubject('${subject}')">
              <div class="subject-icon-bullet">📖</div>
              <div class="subject-name">${subject}</div>
            </div>
          `;
        });
        html += `
            </div>
          </div>
        `;
      });

      document.getElementById('subjectsContent').innerHTML = html;
    }

    function switchBranch(code) {
      // Update active state of pill buttons
      const pills = document.querySelectorAll('.pill-btn');
      pills.forEach(pill => {
        if (pill.innerText.trim() === code) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });

      renderBranch(code);
    }

    function handleGoBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'home.html';
      }
    }

    function openSubject(subjectName) {
      alert("Opening notes & study materials for: " + subjectName);
    }

    // Initialize with CSE on load or from URL parameters
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const branchParam = urlParams.get('branch');
      if (branchParam && branchData[branchParam.toUpperCase()]) {
        switchBranch(branchParam.toUpperCase());
      } else {
        renderBranch('CSE');
      }
    };
  </script>
</body>
</html>
