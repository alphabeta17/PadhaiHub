<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Interactive Quiz & Tests</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .category-pill {
      background: #1b3b2b;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .main-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Quiz Container */
    .quiz-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 28px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d8e2d0;
      padding-bottom: 15px;
    }

    .quiz-title-main {
      font-size: 20px;
      font-weight: 700;
      color: #1b3b2b;
    }

    .question-box {
      font-size: 16px;
      font-weight: 600;
      color: #2d4a3e;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      padding: 12px 18px;
      border-radius: 50px;
      background: #eef2eb;
      box-shadow: inset 4px 4px 8px #cfd6cc, inset -4px -4px 8px #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #3b5345;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    .option-item:hover {
      border-color: #1b3b2b;
    }

    .option-item.selected {
      background: #1b3b2b;
      color: #ffffff;
      box-shadow: none;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .next-btn {
      background: linear-gradient(135deg, #e76f51, #e0532d);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 4px 4px 12px rgba(224, 83, 45, 0.3);
      transition: all 0.2s ease;
    }

    .next-btn:hover {
      transform: translateY(-1px);
    }

    /* Details Card (Rank 1 & Criteria Box) */
    .details-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 12px 12px 24px #cfd6cc, -12px -12px 24px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rank-badge-large {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2eb;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      color: #e76f51;
    }

    .criteria-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eef2eb;
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
    }

    .criteria-label {
      font-size: 13px;
      font-weight: 600;
      color: #6a7b72;
    }

    .criteria-select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      color: #1b3b2b;
      cursor: pointer;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
    }

    .info-label {
      font-weight: 700;
      color: #2d4a3e;
      min-width: 120px;
    }

    .info-value {
      color: #4a5d53;
      font-weight: 500;
      flex: 1;
    }

    /* Right Sidebar: Rankings */
    .sidebar-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title span {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .rankings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-item {
      display: flex;
      gap: 12px;
      background: #eef2eb;
      padding: 12px;
      border-radius: 20px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      align-items: center;
    }

    .rank-item:hover {
      transform: translateX(4px);
      box-shadow: 6px 6px 12px #cfd6cc, -6px -6px 12px #ffffff;
    }

    .rank-number-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 3px 3px 6px #cfd6cc, -3px -3px 6px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #1b3b2b;
      flex-shrink: 0;
    }

    .rank-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
      flex: 1;
    }

    .rank-title {
      font-size: 13px;
      font-weight: 700;
      color: #1b3b2b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-meta {
      font-size: 11px;
      color: #6a7b72;
    }

    .rank-stats {
      font-size: 11px;
      font-weight: 600;
      color: #e76f51;
    }
  </style>
</head>
<body>

  <!-- Background Shapes -->
  <div class="shape shape-peach"></div>
  <div class="shape shape-green"></div>

  <div class="app-container">
    
    <!-- Top Bar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="subjects.html" class="back-btn" title="Back">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="brand-group">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="brand-name">PadhaiHub</div>
        </div>
      </div>

      <div class="category-pill">
        <i class="fa-solid fa-circle-check"></i> Practice Quiz & Tests
      </div>
    </header>

    <!-- Content Grid -->
    <div class="content-grid">
      
      <!-- Left: Interactive Quiz Window & Details -->
      <main class="main-section">
        
        <!-- Quiz Interactive Card -->
        <div class="quiz-card">
          <div class="quiz-header">
            <span class="quiz-title-main" id="quizActiveTitle">Data Structures & Algorithms - Mock Test 1</span>
            <span id="questionCounter" style="font-weight:700; color:#e76f51;">Q 1 of 3</span>
          </div>

          <div class="question-box" id="questionText">
            Loading question...
          </div>

          <div class="options-list" id="optionsContainer">
            <!-- Options dynamically loaded -->
          </div>

          <div class="quiz-footer">
            <span id="scoreTracker" style="font-weight:600; font-size:14px;">Score: 0</span>
            <button class="next-btn" onclick="nextQuestion()" id="nextBtn">Next Question <i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>

        <!-- Details Card -->
        <div class="details-card">
          <div class="details-header">
            <div class="rank-badge-large">
              <i class="fa-solid fa-trophy"></i>
              <span id="rankBadgeText">Rank #1 Quiz Test</span>
            </div>

            <div class="criteria-box">
              <span class="criteria-label">Sort By:</span>
              <select id="criteriaSelect" class="criteria-select" onchange="changeCriteria(this.value)">
                <option value="rating" selected>Accuracy / Rating (Best)</option>
                <option value="submissions">Submissions (Most Popular)</option>
              </select>
            </div>
          </div>

          <div class="info-list">
            <div class="info-item">
              <span class="info-label">Test Creator:</span>
              <span class="info-value" id="dispCreator">Prof. R. Sharma (CSE Dept)</span>
            </div>
            <div class="info-item">
              <span class="info-label">Total Questions:</span>
              <span class="info-value" id="dispTotalQ">3 Questions (MCQ)</span>
            </div>
          </div>
        </div>

      </main>

      <!-- Right Sidebar: Rankings -->
      <aside class="sidebar-card">
        <div class="sidebar-title">
          Other Mock Tests
          <span id="sortedByText">Sorted by Rating</span>
        </div>

        <div class="
