<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Interactive Quiz & Tests</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .category-pill {
      background: #1b3b2b;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .main-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Quiz Container */
    .quiz-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 28px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #d8e2d0;
      padding-bottom: 15px;
    }

    .quiz-title-main {
      font-size: 20px;
      font-weight: 700;
      color: #1b3b2b;
    }

    .question-box {
      font-size: 16px;
      font-weight: 600;
      color: #2d4a3e;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      padding: 12px 18px;
      border-radius: 50px;
      background: #eef2eb;
      box-shadow: inset 4px 4px 8px #cfd6cc, inset -4px -4px 8px #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #3b5345;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    .option-item:hover {
      border-color: #1b3b2b;
    }

    .option-item.selected {
      background: #1b3b2b;
      color: #ffffff;
      box-shadow: none;
    }

    .quiz-option {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border: 2px solid transparent;
      border-radius: 18px;
      background: #eef2eb;
      box-shadow: inset 4px 4px 8px #cfd6cc, inset -4px -4px 8px #ffffff;
      color: #3b5345;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .quiz-option:hover:not(:disabled), .quiz-option:focus-visible {
      border-color: #1b3b2b;
    }

    .quiz-option.correct {
      border-color: #228b54;
      background: #e4f3e8;
    }

    .quiz-option.incorrect {
      border-color: #c94d3f;
      background: #f9e7e4;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .next-btn {
      background: linear-gradient(135deg, #e76f51, #e0532d);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 4px 4px 12px rgba(224, 83, 45, 0.3);
      transition: all 0.2s ease;
    }

    .next-btn:hover {
      transform: translateY(-1px);
    }

    /* Details Card (Rank 1 & Criteria Box) */
    .details-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 12px 12px 24px #cfd6cc, -12px -12px 24px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rank-badge-large {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2eb;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      color: #e76f51;
    }

    .criteria-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eef2eb;
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
    }

    .criteria-label {
      font-size: 13px;
      font-weight: 600;
      color: #6a7b72;
    }

    .criteria-select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      color: #1b3b2b;
      cursor: pointer;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
    }

    .info-label {
      font-weight: 700;
      color: #2d4a3e;
      min-width: 120px;
    }

    .info-value {
      color: #4a5d53;
      font-weight: 500;
      flex: 1;
    }

    /* Right Sidebar: Rankings */
    .sidebar-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title span {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .rankings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-item {
      display: flex;
      width: 100%;
      gap: 12px;
      background: #eef2eb;
      padding: 12px;
      border: 0;
      border-radius: 20px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      align-items: center;
      text-align: left;
      font: inherit;
    }

    .rank-item:hover {
      transform: translateX(4px);
      box-shadow: 6px 6px 12px #cfd6cc, -6px -6px 12px #ffffff;
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .navbar { align-items: flex-start; flex-direction: column; gap: 12px; padding: 14px; border-radius: 20px; }
      .brand-name { font-size: 17px; }
      .category-pill { max-width: 100%; white-space: normal; }
      .quiz-card, .details-card, .sidebar-card { padding: 16px; border-radius: 22px; }
      .quiz-header, .quiz-footer { align-items: flex-start; flex-direction: column; gap: 10px; }
      .quiz-title-main { font-size: 17px; }
      .next-btn { width: 100%; min-height: 44px; }
      .info-item { flex-direction: column; gap: 2px; }
      .info-label { min-width: 0; }
      .sidebar-title { gap: 8px; font-size: 16px; }
    }

    .rank-number-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 3px 3px 6px #cfd6cc, -3px -3px 6px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #1b3b2b;
      flex-shrink: 0;
    }

    .rank-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
      flex: 1;
    }

    .rank-title {
      font-size: 13px;
      font-weight: 700;
      color: #1b3b2b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-meta {
      font-size: 11px;
      color: #6a7b72;
    }

    .rank-stats {
      font-size: 11px;
      font-weight: 600;
      color: #e76f51;
    }
  </style>
</head>
<body>

  <!-- Background Shapes -->
  <div class="shape shape-peach"></div>
  <div class="shape shape-green"></div>

  <div class="app-container">
    
    <!-- Top Bar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="subjects.html" class="back-btn" title="Back">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="brand-group">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="brand-name">PadhaiHub</div>
        </div>
      </div>

      <div class="category-pill">
        <i class="fa-solid fa-circle-check"></i> Practice Quiz & Tests
      </div>
    </header>

    <!-- Content Grid -->
    <div class="content-grid">
      
      <!-- Left: Interactive Quiz Window & Details -->
      <main class="main-section">
        
        <!-- Quiz Interactive Card -->
        <div class="quiz-card">
          <div class="quiz-header">
            <span class="quiz-title-main" id="quizActiveTitle">Data Structures & Algorithms - Mock Test 1</span>
            <span id="questionCounter" style="font-weight:700; color:#e76f51;">Q 1 of 3</span>
          </div>

          <div class="question-box" id="questionText">
            Loading question...
          </div>

          <div class="options-list" id="optionsContainer">
            <!-- Options dynamically loaded -->
          </div>

          <div class="quiz-footer">
            <span id="scoreTracker" style="font-weight:600; font-size:14px;">Score: 0</span>
            <button class="next-btn" onclick="nextQuestion()" id="nextBtn">Next Question <i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>

        <!-- Details Card -->
        <div class="details-card">
          <div class="details-header">
            <div class="rank-badge-large">
              <i class="fa-solid fa-trophy"></i>
              <span id="rankBadgeText">Rank #1 Quiz Test</span>
            </div>

            <div class="criteria-box">
              <span class="criteria-label">Sort By:</span>
              <select id="criteriaSelect" class="criteria-select" onchange="changeCriteria(this.value)">
                <option value="rating" selected>Accuracy / Rating (Best)</option>
                <option value="submissions">Submissions (Most Popular)</option>
              </select>
            </div>
          </div>

          <div class="info-list">
            <div class="info-item">
              <span class="info-label">Test Creator:</span>
              <span class="info-value" id="dispCreator">Prof. R. Sharma (CSE Dept)</span>
            </div>
            <div class="info-item">
              <span class="info-label">Total Questions:</span>
              <span class="info-value" id="dispTotalQ">3 Questions (MCQ)</span>
            </div>
          </div>
        </div>

      </main>

      <!-- Right Sidebar: Rankings -->
      <aside class="sidebar-card">
        <div class="sidebar-title">
          Other Mock Tests
          <span id="sortedByText">Sorted by Rating</span>
        </div>

        <div class="rankings-list" id="rankingsSidebarList"></div>
      </aside>
    </div>
  </div>
  <script>
    const quizSets = [
      {
        title: 'Data Structures & Algorithms - Core Test',
        creator: 'PadhaiHub Learning Team',
        rating: 4.9,
        submissions: 18400,
        questions: [
          { text: 'Which data structure is best suited for implementing a FIFO queue?', options: ['Stack', 'Queue', 'Binary tree', 'Hash table'], answer: 1 },
          { text: 'What is the average time complexity of binary search on a sorted array?', options: ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)'], answer: 1 },
          { text: 'Which traversal of a binary search tree returns keys in sorted order?', options: ['Preorder', 'Postorder', 'Inorder', 'Level order'], answer: 2 },
          { text: 'Which algorithm finds shortest paths from one source when edge weights are non-negative?', options: ['Kruskal', 'Dijkstra', 'Prim', 'DFS'], answer: 1 },
          { text: 'What is the worst-case time complexity of merge sort?', options: ['O(log n)', 'O(n)', 'O(n log n)', 'O(n²)'], answer: 2 }
        ]
      },
      {
        title: 'Operating Systems - Core Test',
        creator: 'PadhaiHub Learning Team',
        rating: 4.8,
        submissions: 15200,
        questions: [
          { text: 'Which condition means a process is waiting for a resource held by another process?', options: ['Mutual exclusion', 'Hold and wait', 'No preemption', 'Circular wait'], answer: 1 },
          { text: 'Which scheduling algorithm uses a fixed time slice?', options: ['FCFS', 'SJF', 'Round Robin', 'Priority only'], answer: 2 },
          { text: 'What does a page fault indicate?', options: ['A page is not in main memory', 'The CPU is overheating', 'A process has ended', 'The disk is full'], answer: 0 },
          { text: 'Which is a necessary condition for deadlock?', options: ['Preemption', 'Circular wait', 'Unlimited resources', 'Process termination'], answer: 1 },
          { text: 'Which memory technique divides memory into fixed-size blocks?', options: ['Segmentation', 'Paging', 'Compaction', 'Overlaying'], answer: 1 }
        ]
      },
      {
        title: 'Database Management Systems - Core Test',
        creator: 'PadhaiHub Learning Team',
        rating: 4.7,
        submissions: 12700,
        questions: [
          { text: 'Which key uniquely identifies each row in a relational table?', options: ['Foreign key', 'Primary key', 'Composite index', 'View'], answer: 1 },
          { text: 'Which normal form removes partial dependency on a composite key?', options: ['1NF', '2NF', '3NF', 'BCNF'], answer: 1 },
          { text: 'Which SQL clause filters grouped rows?', options: ['WHERE', 'ORDER BY', 'HAVING', 'LIMIT'], answer: 2 },
          { text: 'What does ACID atomicity guarantee?', options: ['Transactions are all-or-nothing', 'Data is always encrypted', 'Queries run in parallel', 'Indexes stay sorted'], answer: 0 },
          { text: 'Which join returns only rows with matching values in both tables?', options: ['LEFT JOIN', 'RIGHT JOIN', 'FULL JOIN', 'INNER JOIN'], answer: 3 }
        ]
      }
    ];

    let activeQuiz = quizSets[0];
    let questionIndex = 0;
    let score = 0;
    let answered = false;
    let sortedQuizzes = [];

    const requestedSubject = new URLSearchParams(window.location.search).get('subject');
    if (requestedSubject) {
      const matchingQuiz = quizSets.find(quiz => quiz.title.toLocaleLowerCase().includes(requestedSubject.toLocaleLowerCase()));
      if (matchingQuiz) activeQuiz = matchingQuiz;
    }

    function renderQuestion() {
      const question = activeQuiz.questions[questionIndex];
      document.getElementById('quizActiveTitle').textContent = activeQuiz.title;
      document.getElementById('questionCounter').textContent = `Q ${questionIndex + 1} of ${activeQuiz.questions.length}`;
      document.getElementById('questionText').textContent = question.text;
      document.getElementById('scoreTracker').textContent = `Score: ${score}`;
      document.getElementById('rankBadgeText').textContent = `Practice Test ${quizSets.indexOf(activeQuiz) + 1}`;
      document.getElementById('dispCreator').textContent = activeQuiz.creator;
      document.getElementById('dispTotalQ').textContent = `${activeQuiz.questions.length} Questions (MCQ)`;
      document.getElementById('nextBtn').textContent = questionIndex === activeQuiz.questions.length - 1
        ? 'Finish Test'
        : 'Next Question';

      const options = document.getElementById('optionsContainer');
      options.replaceChildren();
      question.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'quiz-option';
        button.textContent = option;
        button.addEventListener('click', () => selectAnswer(index, button));
        options.append(button);
      });
      answered = false;
    }

    function selectAnswer(selectedIndex, selectedButton) {
      if (answered) return;
      answered = true;
      const correctIndex = activeQuiz.questions[questionIndex].answer;
      for (const [index, option] of [...document.querySelectorAll('.quiz-option')].entries()) {
        option.disabled = true;
        if (index === correctIndex) option.classList.add('correct');
      }
      if (selectedIndex === correctIndex) {
        score++;
      } else {
        selectedButton.classList.add('incorrect');
      }
      document.getElementById('scoreTracker').textContent = `Score: ${score}`;
    }

    function nextQuestion() {
      if (!answered) {
        document.getElementById('scoreTracker').textContent = 'Choose an answer before continuing.';
        return;
      }
      if (questionIndex === activeQuiz.questions.length - 1) {
        document.getElementById('questionText').textContent = `Test complete. You scored ${score} out of ${activeQuiz.questions.length}.`;
        document.getElementById('questionCounter').textContent = 'Completed';
        document.getElementById('optionsContainer').replaceChildren();
        document.getElementById('nextBtn').textContent = 'Restart Test';
        document.getElementById('nextBtn').onclick = restartQuiz;
        return;
      }
      questionIndex++;
      renderQuestion();
    }

    function restartQuiz() {
      questionIndex = 0;
      score = 0;
      document.getElementById('nextBtn').onclick = nextQuestion;
      renderQuestion();
    }

    function selectQuiz(index) {
      activeQuiz = sortedQuizzes[index];
      restartQuiz();
      document.querySelector('.quiz-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function changeCriteria(criteria) {
      renderQuizList(criteria);
    }

    function renderQuizList(criteria = document.getElementById('criteriaSelect').value) {
      const sidebar = document.getElementById('rankingsSidebarList');
      sortedQuizzes = [...quizSets].sort((a, b) => b[criteria] - a[criteria]);
      document.getElementById('sortedByText').textContent = `Sorted by ${criteria === 'rating' ? 'Rating' : 'Submissions'}`;
      sidebar.replaceChildren();
      sortedQuizzes.forEach((quiz, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'rank-item';
        button.addEventListener('click', () => selectQuiz(index));
        button.textContent = `${quiz.title} · ${criteria === 'rating' ? `${quiz.rating} rating` : `${quiz.submissions.toLocaleString()} attempts`}`;
        sidebar.append(button);
      });
    }

    document.querySelector('.back-btn').href =
      `subjects.html?branch=${encodeURIComponent(new URLSearchParams(window.location.search).get('branch') || 'Computer Science & Engineering')}`;
    renderQuizList();
    renderQuestion();
  </script>
</body>
</html>
