<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadhaiHub - Select Category</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { min-height: 100vh; background: #eef2eb; display: flex; justify-content: center; align-items: center; position: relative; overflow-x: hidden; padding: 20px; }
        /* Ambient 3D Geometric Spheres */
        .shape { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; }
        .shape-peach { width: 280px; height: 280px; top: -60px; left: -60px; background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261); opacity: 0.85; }
        .shape-white { width: 140px; height: 140px; right: 5%; top: 38%; background: radial-gradient(circle at 30% 30%, #ffffff, #d5ded0); box-shadow: -10px 10px 25px rgba(0,0,0,0.05); }
        .shape-green { width: 320px; height: 320px; bottom: -100px; right: -80px; background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157); opacity: 0.85; }
        /* Neumorphic Card Container */
        .card-container { position: relative; z-index: 1; width: 100%; max-width: 440px; background: #eef2eb; border-radius: 36px; padding: 35px 30px; box-shadow: 18px 18px 35px #cfd6cc, -18px -18px 35px #ffffff; display: flex; flex-direction: column; align-items: center; }
        /* Back Button */
        .back-btn { position: absolute; top: 25px; left: 25px; width: 36px; height: 36px; border-radius: 50%; background: #eef2eb; box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff; display: flex; align-items: center; justify-content: center; color: #2d4a3e; text-decoration: none; font-size: 14px; transition: all 0.2s ease; border: none; cursor: pointer; }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 6px 6px 12px #cfd6cc, -6px -6px 12px #ffffff; }
        /* Brand Header */
        .brand-logo { width: 52px; height: 52px; background: #1b3b2b; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 22px; margin-bottom: 12px; box-shadow: 4px 6px 12px rgba(27, 59, 43, 0.25); }
        .brand-title { font-size: 24px; font-weight: 700; color: #1b3b2b; letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 13px; color: #6a7b72; margin-top: 4px; margin-bottom: 28px; text-align: center; }
        .category-list { width: 100%; display: flex; flex-direction: column; gap: 18px; }
        /* Clickable Option Card Style */
        .option-card { display: flex; align-items: center; width: 100%; padding: 12px 16px; border-radius: 50px; background: #eef2eb; box-shadow: inset 4px 4px 8px #cfd6cc, inset -4px -4px 8px #ffffff; cursor: pointer; transition: all 0.2s ease; border: 2px solid transparent; user-select: none; }
        .option-card:hover { transform: translateY(-2px); box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff; border-color: #1b3b2b; }
        .option-card:active { transform: translateY(0); box-shadow: inset 5px 5px 10px #cfd6cc, inset -5px -5px 10px #ffffff; }
        /* Circular Badge Icon */
        .icon-badge { width: 44px; height: 44px; border-radius: 50%; background: #eef2eb; box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff; display: flex; align-items: center; justify-content: center; color: #1b3b2b; font-size: 16px; flex-shrink: 0; transition: all 0.2s ease; }
        .option-card:hover .icon-badge { background: #1b3b2b; color: #ffffff; box-shadow: none; }
        .option-label { margin-left: 16px; font-size: 16px; font-weight: 600; color: #2d4a3e; flex-grow: 1; }
        .arrow-icon { color: #6a7b72; font-size: 14px; margin-right: 8px; transition: transform 0.2s ease; }
        .option-card:hover .arrow-icon { transform: translateX(4px); color: #1b3b2b; }
    </style>
</head>
<body>
    <!-- Background Ambient Spheres -->
    <div class="shape shape-peach"></div>
    <div class="shape shape-white"></div>
    <div class="shape shape-green"></div>

    <!-- Main Neumorphic Card Container -->
    <div class="card-container">
        <button class="back-btn" onclick="navigateToSubjects()" title="Go Back">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="brand-logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="brand-title">Categories</h1>
        <p class="brand-subtitle">Select to view relevant lectures</p>

        <div class="category-list">
            <!-- Option 1: One Shot -->
            <div class="option-card" onclick="navigateToCategory('oneshot')">
                <div class="icon-badge"><i class="fa-solid fa-bolt"></i></div>
                <span class="option-label">One shot</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </div>

            <!-- Option 2: Full Detail Course -->
            <div class="option-card" onclick="navigateToCategory('fulldetail')">
                <div class="icon-badge"><i class="fa-solid fa-book-open"></i></div>
                <span class="option-label">Full detail course</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </div>

            <!-- Option 3: Full Playlist -->
            <div class="option-card" onclick="navigateToCategory('playlist')">
                <div class="icon-badge"><i class="fa-solid fa-list"></i></div>
                <span class="option-label">Full Playlist</span>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </div>
        </div>
    </div>

    <script>
    function navigateToCategory(category) {
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get('subject') || 'Data Structures & Algorithms';
    const branch = urlParams.get('branch') || 'CSE';
    
    window.location.href = `youtube-videos.html?branch=${encodeURIComponent(branch)}&subject=${encodeURIComponent(subject)}&category=${category}`;
}
    function navigateToSubjects(){
      window.location.href = `subjects.html`;
    }
</script>
</body>
</html>
