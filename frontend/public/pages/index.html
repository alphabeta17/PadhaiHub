<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadhaiHub - Signup / Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .inline-error {
            color: #d9534f;
            font-size: 12px;
            font-weight: 700;
            margin-top: 4px;
            margin-left: 68px;
            display: none;
        }
        .global-status {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
            min-height: 18px;
        }
        .global-status.success { color: #0f5132; }
        .global-status.error { color: #d9534f; }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="container">
        <header class="brand-header">
            <div class="logo-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="logo-icon">
                    <path d="M11.7 2.805a.75.75 0 0 1 .6 0l9.4 4.7a.75.75 0 0 1 .1.123 1.5 1.5 0 0 1-.1 1.76l-9.4 5.875a.75.75 0 0 1-.6 0l-9.4-5.875A1.5 1.5 0 0 1 2.2 7.63a.75.75 0 0 1 .1-.123l9.4-4.702ZM12 10.41l7.2-4.5L12 2.31 4.8 5.91l7.2 4.5Z"/>
                </svg>
            </div>
            <h1 class="brand-title">PadhaiHub</h1>
            <p class="brand-subtitle">Your Ultimate Learning Platform</p>
        </header>

        <main class="login-card">
            <!-- Email Field -->
            <div>
                <div class="form-row">
                    <button type="button" class="icon-circle-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z"/></svg>
                    </button>
                    <div class="input-wrapper">
                        <input type="email" id="identifier" placeholder="Enter Email" required autocomplete="off">
                    </div>
                </div>
                <div id="emailError" class="inline-error"></div>
            </div>

            <!-- Fetch OTP Button -->
            <div class="fetch-otp-container">
                <button type="button" class="fetch-otp-btn" id="fetchOtpBtn" onclick="handleFetchOTP()">Fetch OTP</button>
            </div>

            <!-- Enter OTP Field -->
            <div>
                <div class="form-row">
                    <button type="button" class="icon-circle-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd"/></svg>
                    </button>
                    <div class="input-wrapper">
                        <input type="text" id="otp" placeholder="Enter OTP" maxlength="6" autocomplete="off">
                    </div>
                </div>
                <div id="otpError" class="inline-error"></div>
            </div>

            <!-- Password Field -->
            <div>
                <div class="form-row">
                    <button type="button" class="icon-circle-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M15.75 1.5a3.75 3.75 0 1 0 0 7.5A3.75 3.75 0 0 0 15.75 1.5ZM4.5 9.75a3 3 0 0 0-3 3v5.25a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3v-5.25a3 3 0 0 0-3-3H4.5Z" clip-rule="evenodd"/></svg>
                    </button>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Create Password" required>
                    </div>
                </div>
                <div id="passwordError" class="inline-error"></div>
            </div>

            <!-- Bottom Actions -->
            <div class="bottom-actions">
                <a href="#" class="login-question-link">signup</a>
                <button type="submit" class="submit-btn" onclick="handleSubmit()">Verify & Proceed</button>
            </div>

            <div id="globalStatus" class="global-status"></div>
        </main>
    </div>

    <script>
        function showInlineError(elementId, message) {
            const errEl = document.getElementById(elementId);
            if (errEl) {
                errEl.innerText = message;
                errEl.style.display = 'block';
            }
        }

        function clearErrors() {
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('otpError').style.display = 'none';
            document.getElementById('passwordError').style.display = 'none';
            document.getElementById('globalStatus').innerText = '';
        }

        async function handleFetchOTP() {
            clearErrors();
            const email = document.getElementById('identifier').value.trim();
            const btn = document.getElementById('fetchOtpBtn');

            if (!email) {
                showInlineError('emailError', 'Please enter your email address.');
                return;
            }

            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const response = await fetch('http://localhost:5000/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();

                if (result.success) {
                    btn.innerText = "OTP Sent!";
                    btn.classList.add('sent');
                    document.getElementById('globalStatus').innerText = "OTP sent successfully to email.";
                    document.getElementById('globalStatus').className = "global-status success";
                } else {
                    btn.innerText = "Fetch OTP";
                    btn.disabled = false;
                    showInlineError('emailError', result.message || "Email already registered.");
                }
            } catch (err) {
                btn.innerText = "Fetch OTP";
                btn.disabled = false;
                showInlineError('emailError', 'Network error. Server unreachable.');
            }
        }

        async function handleSubmit() {
            clearErrors();
            const email = document.getElementById('identifier').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email) { showInlineError('emailError', 'Enter email.'); return; }
            if (!otp) { showInlineError('otpError', 'Enter OTP.'); return; }
            if (!password || password.length < 6) { showInlineError('passwordError', 'Password must be at least 6 characters.'); return; }

            try {
                const response = await fetch('http://localhost:5000/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem("userEmail", email);
                    localStorage.setItem("userPassword", password); // Store temporarily to save in details page
                    window.location.href = 'details.html';
                } else {
                    showInlineError('otpError', result.message || 'Invalid OTP code.');
                }
            } catch (err) {
                showInlineError('otpError', 'Network error during verification.');
            }
        }
    </script>
</body>
</html>
