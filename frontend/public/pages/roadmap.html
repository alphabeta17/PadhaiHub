<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Study & Subject Roadmaps</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .category-pill {
      background: #1b3b2b;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .main-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Viewer Card for Roadmap PDF / Infographic */
    .viewer-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 16px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      position: relative;
    }

    .pdf-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 4px 4px 10px rgba(0,0,0,0.1);
      background: #ffffff;
    }

    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Details Card */
    .details-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 12px 12px 24px #cfd6cc, -12px -12px 24px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rank-badge-large {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2eb;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      color: #e76f51;
    }

    .criteria-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eef2eb;
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
    }

    .criteria-label {
      font-size: 13px;
      font-weight: 600;
      color: #6a7b72;
    }

    .criteria-select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      color: #1b3b2b;
      cursor: pointer;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
    }

    .info-label {
      font-weight: 700;
      color: #2d4a3e;
      min-width: 120px;
    }

    .info-value {
      color: #4a5d53;
      font-weight: 500;
      flex: 1;
    }

    .download-btn {
      background: #e76f51;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      box-shadow: 3px 3px 8px rgba(231, 111, 81, 0.3);
      transition: all 0.2s ease;
    }

    .download-btn:hover {
      background: #d65d3d;
      transform: translateY(-1px);
    }

    /* Right Sidebar: Rankings */
    .sidebar-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title span {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .rankings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-item {
      display: flex;
      gap: 12px;
      background: #eef2eb;
      padding: 12px;
      border-radius: 20px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      align-items: center;
    }

    .rank-item:hover {
      transform: translateX(4px);
      box-shadow: 6px 6px 12px #cfd6cc, -6px -6px 12px #ffffff;
    }

    .rank-number-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 3px 3px 6px #cfd6cc, -3px -3px 6px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #1b3b2b;
      flex-shrink: 0;
    }

    .rank-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
      flex: 1;
    }

    .rank-title {
      font-size: 13px;
      font
