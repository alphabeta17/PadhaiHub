<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadhaiHub - Video Player & Ranking</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef2eb;
      color: #1b3b2b;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Ambient 3D Geometric Spheres */
    .shape {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .shape-peach {
      width: 320px;
      height: 320px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle at 30% 30%, #ffd0b8, #f4a261);
      opacity: 0.65;
    }

    .shape-green {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: -100px;
      background: radial-gradient(circle at 30% 30%, #a4c3b2, #588157);
      opacity: 0.65;
    }

    /* Layout Wrapper */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2eb;
      padding: 16px 28px;
      border-radius: 28px;
      box-shadow: 10px 10px 24px #cfd6cc, -10px -10px 24px #ffffff;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b3b2b;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 14px #cfd6cc, -6px -6px 14px #ffffff;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: #1b3b2b;
      color: #ffffff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 3px 5px 10px rgba(27, 59, 43, 0.2);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .category-pill {
      background: #1b3b2b;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Section: Player & Rank Info */
    .main-video-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Player Container */
    .player-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 16px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      position: relative;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 4px 4px 10px rgba(0,0,0,0.15);
      background: #000;
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Rank 1 Info Box (Directly below player as in Blueprint) */
    .video-details-card {
      background: #eef2eb;
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 12px 12px 24px #cfd6cc, -12px -12px 24px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rank-badge-large {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2eb;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 4px 4px 10px #cfd6cc, -4px -4px 10px #ffffff;
      color: #e76f51;
    }

    /* Criteria Switcher Dropdown */
    .criteria-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #eef2eb;
      padding: 6px 14px;
      border-radius: 30px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
    }

    .criteria-label {
      font-size: 13px;
      font-weight: 600;
      color: #6a7b72;
    }

    .criteria-select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      color: #1b3b2b;
      cursor: pointer;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
    }

    .info-label {
      font-weight: 700;
      color: #2d4a3e;
      min-width: 120px;
    }

    .info-value {
      color: #4a5d53;
      font-weight: 500;
      flex: 1;
    }

    .channel-link {
      color: #e76f51;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .channel-link:hover {
      color: #d64a27;
      text-decoration: underline;
    }

    /* Right Sidebar: Rankings (Rank 2, 3, 4, 5...) */
    .sidebar-card {
      background: #eef2eb;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 14px 14px 28px #cfd6cc, -14px -14px 28px #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title span {
      font-size: 12px;
      color: #6a7b72;
      font-weight: 500;
    }

    .rankings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rank-item {
      display: flex;
      gap: 12px;
      background: #eef2eb;
      padding: 10px;
      border-radius: 20px;
      box-shadow: inset 3px 3px 6px #cfd6cc, inset -3px -3px 6px #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      align-items: center;
    }

    .rank-item:hover {
      transform: translateX(4px);
      box-shadow: 6px 6px 12px #cfd6cc, -6px -6px 12px #ffffff;
    }

    .rank-number-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #eef2eb;
      box-shadow: 3px 3px 6px #cfd6cc, -3px -3px 6px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: #1b3b2b;
      flex-shrink: 0;
    }

    .thumb-box {
      width: 90px;
      height: 56px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rank-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
    }

    .rank-title {
      font-size: 13px;
      font-weight: 700;
      color: #1b3b2b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-channel {
      font-size: 11px;
      color: #6a7b72;
    }

    .rank-stats {
      font-size: 11px;
      font-weight: 600;
      color: #e76f51;
    }
  </style>
</head>
<body>

  <!-- Background Ambient Shapes -->
  <div class="shape shape-peach"></div>
  <div class="shape shape-green"></div>

  <div class="app-container">
    
    <!-- Top Bar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="categories.html" class="back-btn" title="Back to Categories">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="brand-group">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="brand-name">PadhaiHub</div>
        </div>
      </div>

      <div class="category-pill" id="currentCategoryPill">
        <i class="fa-solid fa-bolt"></i> One Shot Lectures
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="content-grid">
      
      <!-- Left: Major Player Window + Rank 1 Info -->
      <main class="main-video-section">
        
        <!-- Player Container -->
        <div class="player-card">
          <div class="iframe-wrapper">
            <iframe id="mainYoutubePlayer" 
              src="https://www.youtube.com/embed/vLqTf2b6GZw?enablejsapi=1&autoplay=1" 
              title="YouTube video player" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>
        </div>

        <!-- Details Card (Rank 1 & Criteria Box) -->
        <div class="video-details-card">
          <div class="details-header">
            
            <div class="rank-badge-large">
              <i class="fa-solid fa-trophy"></i>
              <span id="rankBadgeText">Rank #1 Video</span>
            </div>

            <!-- Criteria Switch Dropdown -->
            <div class="criteria-box">
              <span class="criteria-label">Rank Criteria:</span>
              <select id="criteriaSelect" class="criteria-select" onchange="changeCriteria(this.value)">
                <option value="likes" selected>Likes (Highest Rated)</option>
                <option value="views">Views (Most Popular)</option>
              </select>
            </div>

          </div>

          <div class="info-list">
            <div class="info-item">
              <span class="info-label">Topic Name:</span>
              <span class="info-value" id="dispTopicName">Data Structures & Algorithms Full One Shot</span>
            </div>
            <div class="info-item">
              <span class="info-label">Channel Name:</span>
              <span class="info-value" id="dispChannelName">Apna College</span>
            </div>
            <div class="info-item">
              <span class="info-label">Channel Link:</span>
              <span class="info-value">
                <a href="https://www.youtube.com/@ApnaCollegeOfficial" target="_blank" id="dispChannelLink" class="channel-link">
                  Visit Channel <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 11px;"></i>
                </a>
              </span>
            </div>
          </div>
        </div>

      </main>

      <!-- Right Sidebar: Rankings (Rank 2, Rank 3, Rank 4...) -->
      <aside class="sidebar-card">
        <div class="sidebar-title">
          Other Top Ranks
          <span id="sortedByText">Sorted by Likes</span>
        </div>

        <div class="rankings-list" id="rankingsSidebarList">
          <!-- Dynamically populated rank list items -->
        </div>
      </aside>

    </div>

  </div>

  <script>
    // Sample Educational Videos Dataset
    const videoData = [
      {
        id: "vLqTf2b6GZw",
        title: "DSA in Java Complete Course - One Shot",
        channel: "Apna College",
        channelUrl: "https://www.youtube.com/@ApnaCollegeOfficial",
        likes: 380000,
        views: 8500000
      },
      {
        id: "ER9S84563H0",
        title: "Operating Systems Full Course in 1 Shot",
        channel: "Gate Smashers",
        channelUrl: "https://www.youtube.com/@GateSmashers",
        likes: 420000,
        views: 6200000
      },
      {
        id: "hcI9T_Y_S3k",
        title: "DBMS Complete Playlist / One Shot",
        channel: "Knowledge Gate",
        channelUrl: "https://www.youtube.com/@KnowledgeGate",
        likes: 210000,
        views: 9400000
      },
      {
        id: "py78e_aI94E",
        title: "Python Programming One Shot Tutorial",
        channel: "CodeWithHarry",
        channelUrl: "https://www.youtube.com/@CodeWithHarry",
        likes: 510000,
        views: 12000000
      },
      {
        id: "8jLOx1hD3_o",
        title: "Computer Networks Complete Course",
        channel: "Jenny's Lectures CS IT",
        channelUrl: "https://www.youtube.com/@JennyslecturesCSIT",
        likes: 190000,
        views: 4500000
      }
    ];

    let currentCriteria = 'likes';
    let sortedVideos = [];

    // Load category parameter from URL query string
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const cat = urlParams.get('category') || 'oneshot';
      
      const categoryPill = document.getElementById('currentCategoryPill');
      if (cat === 'fulldetail') {
        categoryPill.innerHTML = `<i class="fa-solid fa-book-open"></i> Full Detailed Courses`;
      } else if (cat === 'livestream') {
        categoryPill.innerHTML = `<i class="fa-solid fa-video"></i> Live Streams`;
      }

      sortAndRenderVideos();
    };

    // Handle Criteria Dropdown Switch (Likes <-> Views)
    function changeCriteria(newCriteria) {
      currentCriteria = newCriteria;
      document.getElementById('sortedByText').innerText = `Sorted by ${newCriteria === 'likes' ? 'Likes' : 'Views'}`;
      sortAndRenderVideos();
    }

    // Sort videos based on selected criteria & refresh views
    function sortAndRenderVideos() {
      // Sort array
      sortedVideos = [...videoData].sort((a, b) => b[currentCriteria] - a[currentCriteria]);

      // Set Rank 1 Video in Main Player
      const rank1 = sortedVideos[0];
      playVideo(0);

      // Render Sidebar Ranks (Rank 2, 3, 4, 5...)
      const sidebarContainer = document.getElementById('rankingsSidebarList');
      sidebarContainer.innerHTML = '';

      sortedVideos.forEach((vid, index) => {
        if (index === 0) return; // Skip Rank 1 from sidebar

        const metricText = currentCriteria === 'likes' 
          ? `${(vid.likes / 1000).toFixed(0)}K Likes` 
          : `${(vid.views / 1000000).toFixed(1)}M Views`;

        const rankItemHTML = `
          <div class="rank-item" onclick="playVideo(${index})">
            <div class="rank-number-badge">#${index + 1}</div>
            <div class="thumb-box">
              <img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg" alt="thumbnail">
            </div>
            <div class="rank-info">
              <div class="rank-title">${vid.title}</div>
              <div class="rank-channel">${vid.channel}</div>
              <div class="rank-stats">${metricText}</div>
            </div>
          </div>
        `;
        sidebarContainer.insertAdjacentHTML('beforeend', rankItemHTML);
      });
    }

    // Play video in main window and update bottom info box
    function playVideo(sortedIndex) {
      const vid = sortedVideos[sortedIndex];

      // Update IFrame Player
      document.getElementById('mainYoutubePlayer').src = `https://www.youtube.com/embed/${vid.id}?autoplay=1`;

      // Update Details
      document.getElementById('rankBadgeText').innerText = `Rank #${sortedIndex + 1} Video`;
      document.getElementById('dispTopicName').innerText = vid.title;
      document.getElementById('dispChannelName').innerText = vid.channel;
      document.getElementById('dispChannelLink').href = vid.channelUrl;
    }
  </script>
</body>
</html>
